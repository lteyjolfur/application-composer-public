name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run validate
      - name: Assemble every variant
        run: |
          for variant in $(sed -n 's/^variant: *//p' data/cv-variants/*.yaml); do
            npm run assemble -- --variant "$variant"
            test -s "output/$variant.md"
          done
      - name: Assemble the example application
        run: |
          npm run assemble -- --application test-app
          git diff --exit-code applications/test-app
